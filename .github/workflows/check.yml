name: Check

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run smoke
      - run: bun run build
      - run: bun run check:package

  compile-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun build --compile src/index.ts --outfile /tmp/mcp-pool-ci --minify
      # Background + poll + kill: the step stays bounded even if a
      # regression keeps the process alive after stdin EOF.
      - name: Compiled binary handshake (--local)
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"0.0.0"}}}' '{"jsonrpc":"2.0","method":"notifications/initialized"}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' > /tmp/handshake.txt
          /tmp/mcp-pool-ci --local --config test/smoke.yaml < /tmp/handshake.txt > /tmp/handshake-out.txt 2>&1 &
          pid=$!
          for i in $(seq 1 120); do grep -q smoke__ /tmp/handshake-out.txt 2>/dev/null && break; sleep 0.5; done
          grep -q smoke__ /tmp/handshake-out.txt
          rc=$?
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          exit $rc
      - name: Compiled binary handshake (daemon)
        run: |
          /tmp/mcp-pool-ci --config test/smoke.yaml < /tmp/handshake.txt > /tmp/handshake-daemon-out.txt 2>&1 &
          pid=$!
          for i in $(seq 1 120); do grep -q smoke__ /tmp/handshake-daemon-out.txt 2>/dev/null && break; sleep 0.5; done
          grep -q smoke__ /tmp/handshake-daemon-out.txt
          rc=$?
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          exit $rc

  binary-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build all platform binaries
        run: scripts/build-binaries.sh "$(bun -e 'console.log((await Bun.file("package.json").json()).version)')" /tmp/mcp-pool-bins
      - name: All legs exist, non-empty, executable
        run: |
          for t in linux-x64 linux-x64-musl linux-arm64 darwin-x64 darwin-arm64 win32-x64 win32-arm64; do
            f="/tmp/mcp-pool-bins/mcp-pool-$t"
            case "$t" in win32-*) f="$f.exe" ;; esac
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
            test -x "$f" || { echo "not executable: $f"; exit 1; }
          done
          file /tmp/mcp-pool-bins/*
      - name: Native handshake (--local + daemon)
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"0.0.0"}}}' '{"jsonrpc":"2.0","method":"notifications/initialized"}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' > /tmp/handshake.txt
          /tmp/mcp-pool-bins/mcp-pool-linux-x64 --local --config test/smoke.yaml < /tmp/handshake.txt > /tmp/matrix-local-out.txt 2>&1 &
          pid=$!
          for i in $(seq 1 120); do grep -q smoke__ /tmp/matrix-local-out.txt 2>/dev/null && break; sleep 0.5; done
          grep -q smoke__ /tmp/matrix-local-out.txt
          rc=$?
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          exit $rc
      - name: Shim handshake (native binary via lookup)
        run: |
          mkdir -p /tmp/shim-probe/node_modules/@yuzu-octopus/mcp-pool-linux-x64/bin
          cp /tmp/mcp-pool-bins/mcp-pool-linux-x64 /tmp/shim-probe/node_modules/@yuzu-octopus/mcp-pool-linux-x64/bin/
          chmod +x /tmp/shim-probe/node_modules/@yuzu-octopus/mcp-pool-linux-x64/bin/*
          cp "$GITHUB_WORKSPACE/platform/linux-x64/package.json" /tmp/shim-probe/node_modules/@yuzu-octopus/mcp-pool-linux-x64/package.json
          cp "$GITHUB_WORKSPACE/bin/mcp-pool.js" /tmp/shim-probe/mcp-pool.js
          chmod +x /tmp/shim-probe/mcp-pool.js
          /tmp/shim-probe/mcp-pool.js --local --config "$GITHUB_WORKSPACE/test/smoke.yaml" < /tmp/handshake.txt > /tmp/matrix-shim-out.txt 2>&1 &
          pid=$!
          for i in $(seq 1 120); do grep -q smoke__ /tmp/matrix-shim-out.txt 2>/dev/null && break; sleep 0.5; done
          grep -q smoke__ /tmp/matrix-shim-out.txt
          rc=$?
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          exit $rc
      - name: Fallback handshake (unknown platform -> dist)
        run: |
          _MCP_POOL_TEST_PLATFORM=sunos-sparc-glibc node "$GITHUB_WORKSPACE/bin/mcp-pool.js" --local --config "$GITHUB_WORKSPACE/test/smoke.yaml" < /tmp/handshake.txt > /tmp/matrix-fallback-out.txt 2>&1 &
          pid=$!
          for i in $(seq 1 120); do grep -q smoke__ /tmp/matrix-fallback-out.txt 2>/dev/null && break; sleep 0.5; done
          grep -q smoke__ /tmp/matrix-fallback-out.txt
          rc=$?
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          exit $rc
      - name: Lookup-table assertion (incl. musl row, unknown fallback)
        run: |
          node --input-type=module -e "
          import('$GITHUB_WORKSPACE/bin/mcp-pool.js').then((m) => {
            const expect = {
              'darwin-arm64-glibc': '@yuzu-octopus/mcp-pool-darwin-arm64',
              'darwin-x64-glibc': '@yuzu-octopus/mcp-pool-darwin-x64',
              'linux-x64-glibc': '@yuzu-octopus/mcp-pool-linux-x64',
              'linux-x64-musl': '@yuzu-octopus/mcp-pool-linux-x64-musl',
              'linux-arm64-glibc': '@yuzu-octopus/mcp-pool-linux-arm64',
              'win32-x64-glibc': '@yuzu-octopus/mcp-pool-win32-x64',
              'win32-arm64-glibc': '@yuzu-octopus/mcp-pool-win32-arm64',
            };
            for (const [k, pkg] of Object.entries(expect)) {
              if (m.TABLE[k]?.[0] !== pkg) throw new Error('table miss: ' + k);
            }
            for (const k of ['sunos-sparc-glibc', 'linux-arm64-musl', 'freebsd-x64-glibc']) {
              if (m.TABLE[k] !== undefined) throw new Error('expected table miss: ' + k);
            }
            if (m.platformKey() !== 'linux-x64-glibc') throw new Error('live key: ' + m.platformKey());
            if (m.isMusl() !== false) throw new Error('glibc runner detected as musl');
            console.log('TABLE-OK');
          });"
      - name: musl probe (alpine container)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/bin:/shim:ro" node:22-alpine node -e "
          import('/shim/mcp-pool.js').then((m) => {
            if (!m.isMusl()) { console.error('musl not detected'); process.exit(1); }
            if (m.platformKey() !== 'linux-x64-musl') { console.error('key: ' + m.platformKey()); process.exit(2); }
            console.log('MUSL-OK');
          });"

  generate-project-page:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev fonts-jetbrains-mono
      - name: Install generator dependencies
        run: pip install uv && uv pip install --system jinja2 pillow cairosvg
      - name: Fetch generator
        run: |
          mkdir -p /tmp/projectsite
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/yuzu-octopus/ProjectSite/main/genpage.py \
            -o /tmp/projectsite/genpage.py
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/yuzu-octopus/ProjectSite/main/template.html.j2 \
            -o /tmp/projectsite/template.html.j2
      - name: Generate project page
        run: python /tmp/projectsite/genpage.py --input project.toml --output docs/index.html
      - name: Commit generated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "ci: regenerate project page [skip ci]"
            git push
          fi
