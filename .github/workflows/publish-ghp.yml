name: Publish GitHub Packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@yuzu-octopus"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      # GitHub Packages only supports scoped names. Keep npmjs canonical
      # (unscoped `mcp-pool`) so the package name is rewritten just for this
      # registry; setup-node already wrote the auth token from GITHUB_TOKEN.
      - run: npm pkg set name=@yuzu-octopus/mcp-pool
      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}