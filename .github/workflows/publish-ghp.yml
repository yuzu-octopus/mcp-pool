name: Publish GitHub Packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      # GitHub Packages only supports scoped names. Keep npmjs canonical
      # (unscoped `mcp-pool`) and rewrite the name just for this registry.
      - run: npm pkg set name=@yuzu-octopus/mcp-pool
      - name: Configure npm auth
        run: printf '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' >> .npmrc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to GitHub Packages
        run: npm publish --registry=https://npm.pkg.github.com