name: Publish GitHub Packages

# GHP mirror carries the MAIN package plus all 7 platform packages (option
# (a): npmjs and GHP stay symmetric, so GHP installs get binaries too — a
# main-only mirror would silently fall back to dist/ for GHP consumers).
# npmjs remains the canonical binary-capable registry.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@yuzu-octopus"
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Build all platform binaries
        run: scripts/build-binaries.sh "$(bun -e 'console.log((await Bun.file("package.json").json()).version)')" /tmp/mcp-pool-bins
      - name: Stage binaries into platform packages
        run: |
          stage() {
            mkdir -p "platform/$1/bin"
            cp "/tmp/mcp-pool-bins/$2" "platform/$1/bin/$2"
            chmod +x "platform/$1/bin/$2"
          }
          stage linux-x64 mcp-pool-linux-x64
          stage linux-x64-musl mcp-pool-linux-x64-musl
          stage linux-arm64 mcp-pool-linux-arm64
          stage darwin-x64 mcp-pool-darwin-x64
          stage darwin-arm64 mcp-pool-darwin-arm64
          stage win32-x64 mcp-pool-win32-x64.exe
          stage win32-arm64 mcp-pool-win32-arm64.exe
      - name: Version equality gate (no skew across the family)
        run: |
          root="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          for d in platform/*/; do
            v="$(F="$d/package.json" bun -e 'console.log((await Bun.file(process.env.F).json()).version)')"
            [ "$v" = "$root" ] || { echo "version skew: $d is $v, root is $root"; exit 1; }
          done
      # Platform packages are already @yuzu-octopus-scoped: publish first,
      # so the main package's exact-pinned optionalDependencies resolve.
      - name: Publish platform packages to GitHub Packages
        run: |
          for d in platform/*/; do (cd "$d" && npm publish); done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # GitHub Packages only supports scoped names. Keep npmjs canonical
      # (unscoped `mcp-pool`) so the package name is rewritten just for this
      # registry; setup-node already wrote the auth token from GITHUB_TOKEN.
      - run: npm pkg set name=@yuzu-octopus/mcp-pool
      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
