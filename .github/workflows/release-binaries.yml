name: Release binaries

# Tag-triggered platform-binary release. Builds one binary per matrix leg on
# its native runner (reproducibility over minutes), uploads artifacts +
# attestations, attaches them to the GitHub Release, then publishes the 7
# platform packages + main to npmjs with Sigstore provenance (esbuild/biome-grade
# supply chain).
#
# Release shape: CI publishes via OIDC trusted publishing (no tokens on
# GitHub, standing rule). scripts/publish-all.sh is the operator-local
# backup for when CI cannot publish.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - suffix: linux-x64
            target: bun-linux-x64
            runner: ubuntu-latest
            outfile: mcp-pool-linux-x64
          - suffix: linux-x64-musl
            target: bun-linux-x64-musl
            runner: ubuntu-latest
            outfile: mcp-pool-linux-x64-musl
          - suffix: linux-arm64
            target: bun-linux-arm64
            runner: ubuntu-latest
            outfile: mcp-pool-linux-arm64
          - suffix: darwin-x64
            target: bun-darwin-x64
            runner: macos-15
            outfile: mcp-pool-darwin-x64
          - suffix: darwin-arm64
            target: bun-darwin-arm64
            runner: macos-15
            outfile: mcp-pool-darwin-arm64
          - suffix: win32-x64
            target: bun-windows-x64
            runner: windows-latest
            outfile: mcp-pool-win32-x64.exe
          - suffix: win32-arm64
            target: bun-windows-arm64
            runner: windows-latest
            outfile: mcp-pool-win32-arm64.exe
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install --frozen-lockfile
      - run: bun build --compile --minify --target ${{ matrix.target }} src/index.ts --outfile ${{ matrix.outfile }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.outfile }}
          path: ${{ matrix.outfile }}

  publish:
    # Tag push is the release. A manual dispatch runs the build for testing
    # but must never publish a branch snapshot over a real version.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist-bin/
          merge-multiple: true
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist-bin/*"
      - name: Stage binaries into platform packages
        run: |
          stage() {
            mkdir -p "platform/$1/bin"
            cp "dist-bin/$2" "platform/$1/bin/$3"
            chmod +x "platform/$1/bin/$3"
          }
          stage linux-x64 mcp-pool-linux-x64 mcp-pool
          stage linux-x64-musl mcp-pool-linux-x64-musl mcp-pool
          stage linux-arm64 mcp-pool-linux-arm64 mcp-pool
          stage darwin-x64 mcp-pool-darwin-x64 mcp-pool
          stage darwin-arm64 mcp-pool-darwin-arm64 mcp-pool
          stage win32-x64 mcp-pool-win32-x64.exe mcp-pool.exe
          stage win32-arm64 mcp-pool-win32-arm64.exe mcp-pool.exe
      - name: Version equality gate (no skew across the family)
        run: scripts/check-versions.sh
      - name: Attach binaries to the GitHub release
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" dist-bin/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish platform packages, then main
        run: |
          for d in platform/*/; do (cd "$d" && npm publish --provenance); done
          npm publish --provenance
