name: Release binaries

# Tag-triggered platform-binary release. Builds one binary per matrix leg on
# its native runner (reproducibility over minutes), uploads artifacts +
# attestations, then publishes the 7 platform packages + main to npmjs with
# Sigstore provenance (esbuild/biome-grade supply chain).
#
# Release shape (operator decision 2026-11-15): BOTH paths are wired.
# PRIMARY is operator-local: download the artifacts from the CI run and run
# scripts/publish-all.sh (no tokens on GitHub, standing rule). FALLBACK is
# the publish job below (OIDC trusted publishing + --provenance); it needs
# the one-time npm trusted-publisher setup for each of the 8 package names.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - suffix: linux-x64
            target: bun-linux-x64
            runner: ubuntu-latest
            outfile: mcp-pool-linux-x64
          - suffix: linux-x64-musl
            target: bun-linux-x64-musl
            runner: ubuntu-latest
            outfile: mcp-pool-linux-x64-musl
          - suffix: linux-arm64
            target: bun-linux-arm64
            runner: ubuntu-latest
            outfile: mcp-pool-linux-arm64
          - suffix: darwin-x64
            target: bun-darwin-x64
            runner: macos-15
            outfile: mcp-pool-darwin-x64
          - suffix: darwin-arm64
            target: bun-darwin-arm64
            runner: macos-15
            outfile: mcp-pool-darwin-arm64
          - suffix: win32-x64
            target: bun-windows-x64
            runner: windows-latest
            outfile: mcp-pool-win32-x64.exe
          - suffix: win32-arm64
            target: bun-windows-arm64
            runner: windows-latest
            outfile: mcp-pool-win32-arm64.exe
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun build --compile --minify --target ${{ matrix.target }} src/index.ts --outfile ${{ matrix.outfile }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.outfile }}
          path: ${{ matrix.outfile }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          path: dist-bin/
          merge-multiple: true
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist-bin/*"
      - name: Stage binaries into platform packages
        run: |
          stage() {
            mkdir -p "platform/$1/bin"
            cp "dist-bin/$2" "platform/$1/bin/$2"
            chmod +x "platform/$1/bin/$2"
          }
          stage linux-x64 mcp-pool-linux-x64
          stage linux-x64-musl mcp-pool-linux-x64-musl
          stage linux-arm64 mcp-pool-linux-arm64
          stage darwin-x64 mcp-pool-darwin-x64
          stage darwin-arm64 mcp-pool-darwin-arm64
          stage win32-x64 mcp-pool-win32-x64.exe
          stage win32-arm64 mcp-pool-win32-arm64.exe
      - name: Version equality gate (no skew across the family)
        run: scripts/check-versions.sh
      - name: Publish platform packages, then main
        run: |
          for d in platform/*/; do (cd "$d" && npm publish --provenance); done
          npm publish --provenance
      - name: Attach binaries to the GitHub release
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || gh release create "${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" dist-bin/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
